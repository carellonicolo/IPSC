name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          echo "Build output size:"
          du -sh dist/
          echo ""
          echo "Files generated:"
          find dist -type f | head -20
          echo ""
          echo "JS bundle size:"
          ls -lh dist/assets/*.js
          echo ""
          echo "CSS bundle size:"
          ls -lh dist/assets/*.css

      - name: Check PWA files
        run: |
          test -f dist/manifest.webmanifest && echo "PWA manifest OK" || echo "PWA manifest MISSING"
          test -f dist/sw.js && echo "Service Worker OK" || echo "Service Worker MISSING"
          test -f dist/registerSW.js && echo "SW registration OK" || echo "SW registration MISSING"
