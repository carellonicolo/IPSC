<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00418A" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="114" fill="url(#appGrad)" />
  
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Pistola: Carrello / Slide -->
    <rect x="120" y="195" width="260" height="55" rx="14" />
    
    <!-- Pistola: Frame frontale -->
    <rect x="120" y="260" width="160" height="25" rx="6" />
    
    <!-- Pistola: Impugnatura / Grip -->
    <path d="M 280 255 
             L 380 255 
             L 355 410 
             C 350 422 335 425 325 415 
             L 285 395 
             C 275 390 270 380 275 370 
             Z" />
             
    <!-- Guardia del grilletto / Trigger Guard -->
    <path d="M 245 285 
             C 240 330 285 330 280 285" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
          
    <!-- Grilletto / Trigger -->
    <line x1="262" y1="285" x2="260" y2="305" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    
    <!-- Mirino Anteriore / Front Sight -->
    <rect x="135" y="180" width="12" height="15" rx="3" />
    
    <!-- Tacca di mira / Rear Sight -->
    <rect x="355" y="175" width="18" height="20" rx="4" />
  </g>
</svg>
